# This workflow will test a Gradle project

name: Gradle test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      with:
        submodules: recursive

    - name: Install backend build dependencies
      uses: tecolicom/actions-use-apt-tools@42cd54f69285d0cb1e013b095e517d05ed6ec34f # v1.6.0
      with:
        tools: gnuplot graphviz python3-graphviz

    - name: Set up JDK 17
      uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build backend
      run: cmake -DCMAKE_BUILD_TYPE=Release -Bbuild && cmake --build build -j8

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

    - name: Test with Gradle Wrapper
      run: ./gradlew test

    - name: Build server distribution
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      run: ./gradlew :server:distZip

    - name: Build client distribution
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      run: ./gradlew :client:wasmJsBrowserDistribution

    - name: Publish backend artifact
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: nons
        path: backend/build/nons
        if-no-files-found: error

    - name: Publish server artifact
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: server
        path: server/build/distributions/server-*.zip
        if-no-files-found: error

    - name: Publish client artifact
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: client
        path: client/build/kotlin-webpack/wasmJs/productionExecutable
        if-no-files-found: error
